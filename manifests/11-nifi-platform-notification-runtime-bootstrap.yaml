apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-notification-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "64"
data:
  bootstrap_flow.py: |
    import json
    import os
    import re
    import ssl
    import time
    import urllib.error
    import urllib.request
    import uuid

    NIFI_API = os.environ.get("NIFI_API", "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api").rstrip("/")
    FLOW_NAME = os.environ.get("NIFI_FLOW_NAME", "platform-notifications")
    CERT_DIR = os.environ.get("NIFI_TLS_DIR", "/nifi-tls")
    KAFKA_CREDENTIALS_DIR = os.environ.get("KAFKA_CREDENTIALS_DIR", "/kafka-credentials")
    KAFKA_BOOTSTRAP_SERVERS = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "kafka.kafka.svc.internal.lan:9092")
    KAFKA_SECURITY_PROTOCOL = os.environ.get("KAFKA_SECURITY_PROTOCOL", "SASL_PLAINTEXT")
    KAFKA_SASL_MECHANISM = os.environ.get("KAFKA_SASL_MECHANISM", "SCRAM-SHA-256")
    FLOW_SECRETS_DIR = os.environ.get("FLOW_SECRETS_DIR", "/flow-secrets")
    REQUEST_TOPIC = os.environ.get("PLATFORM_NOTIFICATION_REQUEST_TOPIC", "platform.notifications.requested.v1")
    DLQ_TOPIC = os.environ.get("PLATFORM_NOTIFICATION_DLQ_TOPIC", "platform.notifications.requested.dlq.v1")
    CONSUMER_GROUP = os.environ.get("PLATFORM_NOTIFICATION_CONSUMER_GROUP", "nifi-platform-notifications-requested-v1")
    SERVICE_URL = os.environ.get("PLATFORM_NOTIFICATION_SERVICE_URL", "http://platform-notification-service.directus.svc.cluster.local:8080").rstrip("/")
    EXECUTOR_URL = os.environ.get("PLATFORM_NOTIFICATION_EXECUTOR_URL", "http://platform-notification-executor.directus.svc.cluster.local:8080").rstrip("/")
    EXECUTION_ENABLED = os.environ.get("PLATFORM_NOTIFICATION_EXECUTION_ENABLED", "false").strip().lower() in ("1", "true", "yes", "on")
    PARAMETER_CONTEXT_NAME = os.environ.get("NIFI_PARAMETER_CONTEXT_NAME", "platform-notification-context")
    CLIENT_ID = str(uuid.uuid4())

    CONTEXT = ssl.create_default_context(cafile=os.path.join(CERT_DIR, "ca.crt"))
    CONTEXT.load_cert_chain(
      certfile=os.path.join(CERT_DIR, "tls.crt"),
      keyfile=os.path.join(CERT_DIR, "tls.key"),
    )

    def api(method, path, payload=None, timeout=60):
      data = None
      headers = {"Accept": "application/json"}
      if payload is not None:
        data = json.dumps(payload).encode("utf-8")
        headers["Content-Type"] = "application/json"
      request = urllib.request.Request(f"{NIFI_API}{path}", data=data, headers=headers, method=method)
      try:
        with urllib.request.urlopen(request, context=CONTEXT, timeout=timeout) as response:
          body = response.read().decode("utf-8")
          return json.loads(body) if body else {}
      except urllib.error.HTTPError as exc:
        body = exc.read().decode("utf-8", errors="replace")
        raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {body}") from exc

    def revision(entity):
      return {
        "clientId": CLIENT_ID,
        "version": entity["revision"]["version"],
      }

    def processor_status(entity):
      try:
        status_entity = api("GET", f"/flow/processors/{entity['id']}/status", timeout=20)
        return status_entity.get("processorStatus") or status_entity.get("status") or {}
      except RuntimeError:
        return {}

    def runtime_sources(entity, status=None):
      entity_status = entity.get("status") or {}
      runtime_status = status if status is not None else processor_status(entity)
      return [
        runtime_status.get("aggregateSnapshot") or {},
        runtime_status,
        entity_status.get("aggregateSnapshot") or {},
        entity_status,
        entity.get("component") or {},
      ]

    def active_thread_count(entity, status=None):
      for source in runtime_sources(entity, status):
        value = source.get("activeThreadCount")
        if isinstance(value, int):
          return value
        if isinstance(value, str) and value.isdigit():
          return int(value)
      return 0

    def normalized_runtime_state(entity, status=None):
      for source in runtime_sources(entity, status):
        value = source.get("runStatus") or source.get("state") or source.get("physicalState")
        if value:
          return str(value).upper()
      return ""

    def processor_is_stopped_and_idle(entity):
      status = processor_status(entity)
      component = entity.get("component") or {}
      component_state = str(component.get("state") or "").upper()
      physical_state = str(component.get("physicalState") or component_state).upper()
      runtime_state = normalized_runtime_state(entity, status)
      active_threads = active_thread_count(entity, status)
      running_states = {"RUNNING", "STARTING", "STOPPING"}
      return (
        component_state == "STOPPED"
        and physical_state not in running_states
        and runtime_state not in running_states
        and active_threads == 0
      )

    def processor_running_configuration_error(error):
      return "while the Processor is running" in str(error)

    def read_secret_file(directory, name):
      with open(os.path.join(directory, name), "r", encoding="utf-8") as secret_file:
        return secret_file.read().strip()

    def read_kafka_secret(name):
      return read_secret_file(KAFKA_CREDENTIALS_DIR, name)

    def read_flow_secret(name):
      return read_secret_file(FLOW_SECRETS_DIR, name)

    def norm(value):
      return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

    def descriptor_key(descriptors, candidates):
      wanted = {norm(candidate) for candidate in candidates}
      for key, descriptor in descriptors.items():
        names = [key, descriptor.get("name"), descriptor.get("displayName")]
        if any(norm(name) in wanted for name in names):
          return key
      available = ", ".join(sorted(descriptors.keys()))
      raise RuntimeError(f"Could not find descriptor {candidates}; available: {available}")

    def wait_for_cluster():
      last_error = None
      for _ in range(120):
        try:
          cluster = api("GET", "/controller/cluster", timeout=20).get("cluster", {})
          nodes = cluster.get("nodes", [])
          if nodes and all(node.get("status") == "CONNECTED" for node in nodes):
            return
        except Exception as exc:
          last_error = exc
        time.sleep(5)
      raise RuntimeError(f"NiFi cluster was not ready: {last_error}")

    def find_process_group():
      root = api("GET", "/flow/process-groups/root", timeout=30).get("processGroupFlow", {})
      for process_group in root.get("flow", {}).get("processGroups", []):
        component = process_group.get("component", {})
        if component.get("name") == FLOW_NAME:
          return component["id"]
      return ""

    def ensure_process_group():
      process_group_id = find_process_group()
      if process_group_id:
        return process_group_id
      created = api(
        "POST",
        "/process-groups/root/process-groups",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": FLOW_NAME,
            "position": {"x": 800, "y": 420},
          },
        },
      )
      return created["component"]["id"]

    def find_parameter_context():
      for parameter_context in api("GET", "/flow/parameter-contexts").get("parameterContexts", []):
        component = parameter_context.get("component", {})
        if component.get("name") == PARAMETER_CONTEXT_NAME:
          return parameter_context
      raise RuntimeError(f"Parameter context {PARAMETER_CONTEXT_NAME} was not found.")

    def ensure_process_group_parameter_context(process_group_id):
      parameter_context = find_parameter_context()
      process_group = api("GET", f"/process-groups/{process_group_id}")
      component = process_group["component"]
      current_context = component.get("parameterContext") or {}
      if current_context.get("id") == parameter_context["id"]:
        return
      api(
        "PUT",
        f"/process-groups/{process_group_id}",
        {
          "revision": revision(process_group),
          "component": {
            "id": process_group_id,
            "name": component.get("name", FLOW_NAME),
            "position": component.get("position", {"x": 800, "y": 420}),
            "parameterContext": {"id": parameter_context["id"]},
          },
        },
      )

    def list_processors(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/processors").get("processors", [])

    def list_connections(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/connections").get("connections", [])

    def list_controller_services(process_group_id):
      return api("GET", f"/flow/process-groups/{process_group_id}/controller-services").get("controllerServices", [])

    def find_by_name(entities, name):
      for entity in entities:
        if entity.get("component", {}).get("name") == name:
          return entity
      return None

    def ensure_controller_service(process_group_id):
      existing = find_by_name(list_controller_services(process_group_id), "platform-notification-kafka-connection")
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/controller-services",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": "platform-notification-kafka-connection",
            "type": "org.apache.nifi.kafka.service.Kafka3ConnectionService",
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": "nifi-kafka-3-service-nar",
              "version": "2.7.1",
            },
          },
        },
      )

    def ensure_processor(process_group_id, name, processor_type, artifact, x, y):
      existing = find_by_name(list_processors(process_group_id), name)
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/processors",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "type": processor_type,
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": artifact,
              "version": "2.7.1",
            },
            "position": {"x": x, "y": y},
          },
        },
      )

    def configure_controller_service(entity, property_specs):
      entity = api("GET", f"/controller-services/{entity['id']}")
      component = entity["component"]
      descriptors = component.get("descriptors", {})
      properties = dict(component.get("properties") or {})
      for candidates, value in property_specs:
        properties[descriptor_key(descriptors, candidates)] = value
      return api(
        "PUT",
        f"/controller-services/{entity['id']}",
        {
          "revision": revision(entity),
          "component": {
            "id": entity["id"],
            "properties": properties,
          },
        },
      )

    def configure_processor(entity, property_specs, auto_terminated=None, dynamic_property_specs=None, remove_dynamic_property_names=None):
      properties_to_remove = list(remove_dynamic_property_names or [])
      updated = None
      for attempt in range(12):
        entity = set_processor_state(entity, "STOPPED")
        entity = api("GET", f"/processors/{entity['id']}")
        config = entity["component"].get("config", {})
        descriptors = config.get("descriptors", {})
        properties = dict(config.get("properties") or {})
        for candidates, value in property_specs:
          properties[descriptor_key(descriptors, candidates)] = value
        for name in properties_to_remove:
          properties[name] = None
        for name, value in dynamic_property_specs or []:
          properties[name] = value

        new_config = {"properties": properties}
        if auto_terminated is not None:
          new_config["autoTerminatedRelationships"] = auto_terminated
        try:
          updated = api(
            "PUT",
            f"/processors/{entity['id']}",
            {
              "revision": revision(entity),
              "component": {
                "id": entity["id"],
                "config": new_config,
              },
            },
          )
          break
        except RuntimeError as exc:
          if not processor_running_configuration_error(exc) or attempt == 11:
            raise
          set_processor_state(entity, "STOPPED")
          time.sleep(2 + attempt)
      if updated is None:
        raise RuntimeError(f"Processor {entity['component'].get('name', entity['id'])} was not configured.")
      if properties_to_remove:
        refreshed = api("GET", f"/processors/{entity['id']}")
        refreshed_properties = (refreshed["component"].get("config", {}) or {}).get("properties") or {}
        remaining = [name for name in properties_to_remove if refreshed_properties.get(name) not in (None, "")]
        if remaining:
          raise RuntimeError(f"Processor {entity['component'].get('name', entity['id'])} still has removed dynamic properties: {remaining}")
      return updated

    def set_processor_state(entity, state):
      last_error = None
      transition_state = {"RUNNING": "STARTING", "STOPPED": "STOPPING"}.get(state)
      for _ in range(120):
        current = api("GET", f"/processors/{entity['id']}")
        component = current["component"]
        current_state = component.get("state")
        physical_state = component.get("physicalState") or current_state
        if state == "STOPPED" and processor_is_stopped_and_idle(current):
          return current
        if state != "STOPPED" and current_state == state and physical_state == state:
          return current
        if physical_state == transition_state:
          time.sleep(1)
          continue
        try:
          api(
            "PUT",
            f"/processors/{entity['id']}/run-status",
            {
              "revision": revision(current),
              "state": state,
              "disconnectedNodeAcknowledged": False,
            },
          )
        except RuntimeError as exc:
          last_error = exc
          if "HTTP 409" not in str(exc):
            raise
        time.sleep(1)
      if last_error:
        raise last_error
      raise RuntimeError(f"Processor {entity['component']['name']} did not reach {state}.")

    def set_controller_service_state(entity, state):
      entity = api("GET", f"/controller-services/{entity['id']}")
      if entity["component"].get("state") == state:
        return entity
      api(
        "PUT",
        f"/controller-services/{entity['id']}/run-status",
        {
          "revision": revision(entity),
          "state": state,
          "disconnectedNodeAcknowledged": False,
        },
      )
      for _ in range(60):
        current = api("GET", f"/controller-services/{entity['id']}")
        if current["component"].get("state") == state:
          return current
        time.sleep(1)
      raise RuntimeError(f"Controller service {entity['component']['name']} did not reach {state}.")

    def ensure_connection(process_group_id, name, source_id, destination_id, relationships):
      for connection in list_connections(process_group_id):
        component = connection.get("component", {})
        if component.get("name") == name:
          current_source = component.get("source") or {}
          current_destination = component.get("destination") or {}
          current_relationships = sorted(component.get("selectedRelationships") or [])
          if (
            current_source.get("id") == source_id
            and current_destination.get("id") == destination_id
            and current_relationships == sorted(relationships)
          ):
            return connection
          connection = api("GET", f"/connections/{connection['id']}")
          return api(
            "PUT",
            f"/connections/{connection['id']}",
            {
              "revision": revision(connection),
              "component": {
                "id": connection["id"],
                "name": name,
                "source": {
                  "id": source_id,
                  "groupId": process_group_id,
                  "type": "PROCESSOR",
                },
                "destination": {
                  "id": destination_id,
                  "groupId": process_group_id,
                  "type": "PROCESSOR",
                },
                "selectedRelationships": relationships,
              },
            },
          )
      return api(
        "POST",
        f"/process-groups/{process_group_id}/connections",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "source": {
              "id": source_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "destination": {
              "id": destination_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "selectedRelationships": relationships,
            "flowFileExpiration": "0 sec",
            "backPressureObjectThreshold": 10000,
            "backPressureDataSizeThreshold": "1 GB",
          },
        },
      )

    def main():
      wait_for_cluster()
      process_group_id = ensure_process_group()

      kafka_service = ensure_controller_service(process_group_id)
      consume = ensure_processor(process_group_id, "consume-platform-notification-requests", "org.apache.nifi.kafka.processors.ConsumeKafka", "nifi-kafka-nar", 0, 0)
      extract_metadata = ensure_processor(process_group_id, "extract-platform-notification-metadata", "org.apache.nifi.processors.standard.EvaluateJsonPath", "nifi-standard-nar", 300, 0)
      extract_recipient = ensure_processor(process_group_id, "extract-platform-notification-recipient-json", "org.apache.nifi.processors.standard.EvaluateJsonPath", "nifi-standard-nar", 600, 0)
      set_auth = ensure_processor(process_group_id, "set-platform-notification-authorization", "org.apache.nifi.processors.attributes.UpdateAttribute", "nifi-update-attribute-nar", 900, 0)
      build_processing = ensure_processor(process_group_id, "build-platform-notification-processing-callback", "org.apache.nifi.processors.standard.ReplaceText", "nifi-standard-nar", 1200, 0)
      mark_processing = ensure_processor(process_group_id, "mark-platform-notification-processing", "org.apache.nifi.processors.standard.InvokeHTTP", "nifi-standard-nar", 1500, 0)
      resolve_rules = ensure_processor(process_group_id, "resolve-platform-notification-rules", "org.apache.nifi.processors.attributes.UpdateAttribute", "nifi-update-attribute-nar", 1800, 0)
      render_message = ensure_processor(process_group_id, "render-platform-notification-message", "org.apache.nifi.processors.standard.ReplaceText", "nifi-standard-nar", 2100, 0)
      invoke_delivery = ensure_processor(process_group_id, "invoke-platform-notification-delivery", "org.apache.nifi.processors.standard.InvokeHTTP", "nifi-standard-nar", 2400, 0)
      extract_delivery_result = ensure_processor(process_group_id, "extract-platform-notification-delivery-result", "org.apache.nifi.processors.standard.EvaluateJsonPath", "nifi-standard-nar", 2700, 0)
      normalize_delivery_result = ensure_processor(process_group_id, "normalize-platform-notification-delivery-result", "org.apache.nifi.processors.attributes.UpdateAttribute", "nifi-update-attribute-nar", 3000, 0)
      build_attempt = ensure_processor(process_group_id, "build-platform-notification-delivery-attempt", "org.apache.nifi.processors.standard.ReplaceText", "nifi-standard-nar", 3300, 0)
      record_attempt = ensure_processor(process_group_id, "record-platform-notification-delivery-attempt", "org.apache.nifi.processors.standard.InvokeHTTP", "nifi-standard-nar", 3600, 0)
      build_success = ensure_processor(process_group_id, "build-platform-notification-success-callback", "org.apache.nifi.processors.standard.ReplaceText", "nifi-standard-nar", 3900, 0)
      finish_sent = ensure_processor(process_group_id, "finish-platform-notification-sent", "org.apache.nifi.processors.standard.InvokeHTTP", "nifi-standard-nar", 4200, 0)
      build_failure = ensure_processor(process_group_id, "build-platform-notification-failure-callback", "org.apache.nifi.processors.standard.ReplaceText", "nifi-standard-nar", 2100, 360)
      finish_failed = ensure_processor(process_group_id, "finish-platform-notification-failed", "org.apache.nifi.processors.standard.InvokeHTTP", "nifi-standard-nar", 2400, 360)
      dlq = ensure_processor(process_group_id, "publish-platform-notification-dlq", "org.apache.nifi.kafka.processors.PublishKafka", "nifi-kafka-nar", 2700, 360)

      processors = [
        consume, extract_metadata, extract_recipient, set_auth, build_processing, mark_processing,
        resolve_rules, render_message, invoke_delivery, extract_delivery_result, normalize_delivery_result,
        build_attempt, record_attempt, build_success, finish_sent, build_failure, finish_failed, dlq,
      ]
      for processor in processors:
        set_processor_state(processor, "STOPPED")

      ensure_process_group_parameter_context(process_group_id)

      kafka_service = set_controller_service_state(kafka_service, "DISABLED")
      kafka_service = configure_controller_service(
        kafka_service,
        [
          (["bootstrap.servers", "Bootstrap Servers"], KAFKA_BOOTSTRAP_SERVERS),
          (["security.protocol", "Security Protocol"], KAFKA_SECURITY_PROTOCOL),
          (["sasl.mechanism", "SASL Mechanism"], KAFKA_SASL_MECHANISM),
          (["sasl.username", "SASL Username"], read_kafka_secret("nifi_username")),
          (["sasl.password", "SASL Password"], "#{nifi_password}"),
        ],
      )
      kafka_service = set_controller_service_state(kafka_service, "ENABLED")

      consume = configure_processor(
        consume,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Group ID"], CONSUMER_GROUP),
          (["Topics"], REQUEST_TOPIC),
          (["auto.offset.reset", "Auto Offset Reset"], "earliest"),
        ],
      )
      extract_metadata = configure_processor(
        extract_metadata,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "auto-detect"),
          (["Path Not Found Behavior"], "ignore"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [
          ("platform.notification_request_id", "$.notification_request_id"),
          ("platform.event_key", "$.event_key"),
          ("platform.source", "$.source"),
          ("platform.severity", "$.severity"),
          ("platform.priority", "$.priority"),
          ("platform.subject", "$.subject"),
          ("platform.body", "$.body"),
          ("platform.organization_id", "$.organization_id"),
          ("platform.app_id", "$.app_id"),
          ("platform.template_key", "$.template_key"),
          ("platform.correlation_id", "$.correlation_id"),
          ("platform.requested_channel", "$.channels[0]"),
        ],
        ["platform.requested_recipient_json"],
      )
      extract_recipient = configure_processor(
        extract_recipient,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "json"),
          (["Path Not Found Behavior"], "ignore"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [
          ("platform.requested_recipient_json", "$.recipients[0]"),
          ("platform.rendered_message_json", "$.message"),
          ("platform.rendered_message_options_json", "$.message.options"),
        ],
      )
      set_auth = configure_processor(
        set_auth,
        [],
        None,
        [
          ("Authorization", f"Bearer {read_flow_secret('platform_notification_service_token')}"),
          ("platform.notification_execution_enabled", "true" if EXECUTION_ENABLED else "false"),
          ("platform.delivery_channel", "browser_push"),
          ("platform.delivery_provider_key", "web-push:browser_push"),
          ("platform.delivery_recipient_json", "${platform.requested_recipient_json}"),
        ],
      )
      build_processing = configure_processor(
        build_processing,
        [
          (["Replacement Strategy"], "Always Replace"),
          (["Replacement Value"], "{\"status\":\"processing\",\"message\":\"Notification request is being processed by NiFi.\"}"),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      mark_processing = configure_processor(
        mark_processing,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{SERVICE_URL}/internal/notifications/${{platform.notification_request_id}}/status"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response"],
      )
      resolve_rules = configure_processor(
        resolve_rules,
        [],
        None,
        [
          ("platform.notification_rules_placeholder", "true"),
          ("platform.notification_template_placeholder", "true"),
        ],
      )
      render_message = configure_processor(
        render_message,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"channel\":\"${platform.delivery_channel:escapeJson()}\",\"provider_key\":\"${platform.delivery_provider_key:escapeJson()}\",\"recipient\":${platform.delivery_recipient_json},\"message\":${platform.rendered_message_json},\"options\":${platform.rendered_message_options_json},\"metadata\":{\"source\":\"nifi-platform-notification-flow\",\"correlation_id\":\"${platform.correlation_id:escapeJson()}\",\"event_key\":\"${platform.event_key:escapeJson()}\",\"notification_key\":\"${platform.template_key:escapeJson()}\"}}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      invoke_delivery = configure_processor(
        invoke_delivery,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{EXECUTOR_URL}/internal/notifications/${{platform.notification_request_id}}/deliveries"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "120 sec"),
        ],
        ["Original"],
      )
      extract_delivery_result = configure_processor(
        extract_delivery_result,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "auto-detect"),
          (["Path Not Found Behavior"], "ignore"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [
          ("platform.executor_ok", "$.ok"),
          ("platform.executor_status", "$.status"),
          ("platform.executor_provider_message_id", "$.provider_message_id"),
          ("platform.executor_response_provider", "$.response_json.provider"),
          ("platform.executor_response_subscription_id", "$.response_json.subscription_id"),
          ("platform.executor_response_endpoint_hash", "$.response_json.endpoint_hash"),
          ("platform.executor_response_status_code", "$.response_json.status_code"),
          ("platform.executor_response_mode", "$.response_json.mode"),
          ("platform.executor_error_message", "$.error_message"),
        ],
        ["platform.executor_response_json"],
      )
      normalize_delivery_result = configure_processor(
        normalize_delivery_result,
        [],
        None,
        [
          ("platform.executor_http_status_code", "${invokehttp.status.code}"),
          ("platform.executor_attempt_status", "${platform.executor_status:replaceEmpty('failed')}"),
          ("platform.notification_terminal_status", "${platform.executor_status:equals('sent'):ifElse('sent','failed')}"),
          ("platform.executor_response_payload_json", "{\"provider\":\"${platform.executor_response_provider:escapeJson()}\",\"subscription_id\":\"${platform.executor_response_subscription_id:escapeJson()}\",\"endpoint_hash\":\"${platform.executor_response_endpoint_hash:escapeJson()}\",\"status_code\":\"${platform.executor_response_status_code:escapeJson()}\",\"mode\":\"${platform.executor_response_mode:escapeJson()}\"}"),
        ],
      )
      build_attempt = configure_processor(
        build_attempt,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"channel\":\"${platform.delivery_channel:escapeJson()}\",\"provider_key\":\"${platform.delivery_provider_key:escapeJson()}\",\"recipient_json\":${platform.delivery_recipient_json},\"message_json\":${platform.rendered_message_json},\"status\":\"${platform.executor_attempt_status:escapeJson()}\",\"provider_message_id\":\"${platform.executor_provider_message_id:escapeJson()}\",\"response_json\":{\"executor_http_status_code\":\"${platform.executor_http_status_code:escapeJson()}\",\"executor_ok\":\"${platform.executor_ok:escapeJson()}\",\"executor_response\":${platform.executor_response_payload_json}},\"error_message\":\"${platform.executor_error_message:escapeJson()}\"}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      record_attempt = configure_processor(
        record_attempt,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{SERVICE_URL}/internal/notifications/${{platform.notification_request_id}}/delivery-attempts"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response"],
      )
      build_success = configure_processor(
        build_success,
        [
          (["Replacement Strategy"], "Always Replace"),
          (["Replacement Value"], "{\"status\":\"${platform.notification_terminal_status:escapeJson()}\",\"message\":\"Notification request delivery execution finished by the platform notification flow.\",\"result_json\":{\"completed_by\":\"nifi-platform-notification-flow\",\"executor_http_status_code\":\"${platform.executor_http_status_code:escapeJson()}\",\"executor_ok\":\"${platform.executor_ok:escapeJson()}\",\"executor_status\":\"${platform.executor_status:escapeJson()}\",\"provider_message_id\":\"${platform.executor_provider_message_id:escapeJson()}\"},\"error_message\":\"${platform.executor_error_message:escapeJson()}\"}"),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      finish_sent = configure_processor(
        finish_sent,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{SERVICE_URL}/internal/notifications/${{platform.notification_request_id}}/status"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response", "Original"],
      )
      build_failure = configure_processor(
        build_failure,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"status\":\"failed\",\"message\":\"Notification flow failed before completion.\",\"error_message\":\"See NiFi bulletin and platform notification DLQ for the failed flowfile.\",\"result_json\":{\"failed_by\":\"nifi-platform-notification-flow\",\"execution_enabled\":\"${platform.notification_execution_enabled:escapeJson()}\"}}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      finish_failed = configure_processor(
        finish_failed,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{SERVICE_URL}/internal/notifications/${{platform.notification_request_id}}/status"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response"],
      )
      dlq = configure_processor(
        dlq,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Topic Name", "Topic"], DLQ_TOPIC),
        ],
        ["success", "failure"],
      )

      ensure_connection(process_group_id, "notification-consume-to-extract", consume["id"], extract_metadata["id"], ["success"])
      ensure_connection(process_group_id, "notification-extract-to-auth", extract_metadata["id"], extract_recipient["id"], ["matched"])
      ensure_connection(process_group_id, "notification-extract-failure-to-dlq", extract_metadata["id"], dlq["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "notification-recipient-to-auth", extract_recipient["id"], set_auth["id"], ["matched"])
      ensure_connection(process_group_id, "notification-recipient-failure-to-dlq", extract_recipient["id"], dlq["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "notification-auth-to-processing-body", set_auth["id"], build_processing["id"], ["success"])
      ensure_connection(process_group_id, "notification-processing-body-to-status", build_processing["id"], mark_processing["id"], ["success"])
      ensure_connection(process_group_id, "notification-processing-body-failure-to-failure-body", build_processing["id"], build_failure["id"], ["failure"])
      ensure_connection(process_group_id, "notification-processing-failure-to-failure-body", mark_processing["id"], build_failure["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "notification-processing-to-rules", mark_processing["id"], resolve_rules["id"], ["Original"])
      ensure_connection(process_group_id, "notification-rules-to-render", resolve_rules["id"], render_message["id"], ["success"])
      ensure_connection(process_group_id, "notification-render-to-delivery", render_message["id"], invoke_delivery["id"], ["success"])
      ensure_connection(process_group_id, "notification-render-failure-to-failure-body", render_message["id"], build_failure["id"], ["failure"])
      ensure_connection(process_group_id, "notification-delivery-to-attempt-body", invoke_delivery["id"], extract_delivery_result["id"], ["Response"])
      ensure_connection(process_group_id, "notification-delivery-failure-to-failure-body", invoke_delivery["id"], build_failure["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "notification-result-extract-to-normalize", extract_delivery_result["id"], normalize_delivery_result["id"], ["matched"])
      ensure_connection(process_group_id, "notification-result-extract-failure-to-failure-body", extract_delivery_result["id"], build_failure["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "notification-result-normalize-to-attempt-body", normalize_delivery_result["id"], build_attempt["id"], ["success"])
      ensure_connection(process_group_id, "notification-attempt-body-to-record", build_attempt["id"], record_attempt["id"], ["success"])
      ensure_connection(process_group_id, "notification-attempt-body-failure-to-failure-body", build_attempt["id"], build_failure["id"], ["failure"])
      ensure_connection(process_group_id, "notification-record-to-success-body", record_attempt["id"], build_success["id"], ["Original"])
      ensure_connection(process_group_id, "notification-record-failure-to-failure-body", record_attempt["id"], build_failure["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "notification-success-body-to-finish", build_success["id"], finish_sent["id"], ["success"])
      ensure_connection(process_group_id, "notification-success-body-failure-to-dlq", build_success["id"], dlq["id"], ["failure"])
      ensure_connection(process_group_id, "notification-finish-failure-to-dlq", finish_sent["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "notification-failure-body-to-finish", build_failure["id"], finish_failed["id"], ["success"])
      ensure_connection(process_group_id, "notification-failure-body-failure-to-dlq", build_failure["id"], dlq["id"], ["failure"])
      ensure_connection(process_group_id, "notification-finish-failed-to-dlq", finish_failed["id"], dlq["id"], ["Original", "Failure", "No Retry", "Retry"])

      processors_to_start = [dlq]
      if EXECUTION_ENABLED:
        processors_to_start = [
          dlq,
          finish_failed,
          build_failure,
          finish_sent,
          build_success,
          record_attempt,
          build_attempt,
          normalize_delivery_result,
          extract_delivery_result,
          invoke_delivery,
          render_message,
          resolve_rules,
          mark_processing,
          build_processing,
          set_auth,
          extract_recipient,
          extract_metadata,
          consume,
        ]

      for processor in processors_to_start:
        set_processor_state(processor, "RUNNING")
      mode = "execution enabled" if EXECUTION_ENABLED else "configured but not consuming"
      print(f"Platform notification NiFi flow is configured in process group {process_group_id} ({mode}).")

    if __name__ == "__main__":
      main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-notification-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "67"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-notification-nifi-runtime-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-runtime-flow
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_API
              value: "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api"
            - name: NIFI_FLOW_NAME
              value: "platform-notifications"
            - name: NIFI_TLS_DIR
              value: "/nifi-tls"
            - name: KAFKA_CREDENTIALS_DIR
              value: "/kafka-credentials"
            - name: FLOW_SECRETS_DIR
              value: "/flow-secrets"
            - name: NIFI_PARAMETER_CONTEXT_NAME
              value: "platform-notification-context"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: kafka_bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: kafka_security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: kafka_sasl_mechanism
            - name: PLATFORM_NOTIFICATION_REQUEST_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: request_topic
            - name: PLATFORM_NOTIFICATION_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: dlq_topic
            - name: PLATFORM_NOTIFICATION_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: consumer_group
            - name: PLATFORM_NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: platform_notification_service_url
            - name: PLATFORM_NOTIFICATION_EXECUTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: platform_notification_executor_url
            - name: PLATFORM_NOTIFICATION_EXECUTION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: platform-notification-flow-config
                  key: execution_enabled
          command: ["python", "/bootstrap/bootstrap_flow.py"]
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
            - name: nifi-tls
              mountPath: /nifi-tls
              readOnly: true
            - name: kafka-credentials
              mountPath: /kafka-credentials
              readOnly: true
            - name: flow-secrets
              mountPath: /flow-secrets
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: platform-notification-nifi-runtime-bootstrap
            defaultMode: 0555
        - name: nifi-tls
          secret:
            secretName: nifi-external-cluster-tls-auth
        - name: kafka-credentials
          secret:
            secretName: platform-notification-kafka-credentials
        - name: flow-secrets
          secret:
            secretName: platform-notification-flow-secrets
