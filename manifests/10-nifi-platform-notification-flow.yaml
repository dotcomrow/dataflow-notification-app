apiVersion: nifi.konpyutaika.com/v2alpha1
kind: NifiRegistryClient
metadata:
  name: platform-notification-flow-registry
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "62"
spec:
  clusterRef:
    name: nifi-external
    namespace: dataflow
  description: "Registry client for platform notification orchestration"
  type: registry
  registryClientConfig:
    uri: "http://nifi-registry.dataflow.svc.cluster.local:18080"
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiParameterContext
metadata:
  name: platform-notification-context
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "63"
spec:
  description: "Parameters for platform notification orchestration"
  clusterRef:
    name: nifi-external
    namespace: dataflow
  secretRefs:
    - name: platform-notification-kafka-credentials
      namespace: dataflow
  parameters:
    - name: platform.kafka.bootstrap.servers
      value: kafka.kafka.svc.internal.lan:9092
    - name: platform.kafka.security.protocol
      value: SASL_PLAINTEXT
    - name: platform.kafka.sasl.mechanism
      value: SCRAM-SHA-256
    - name: platform.notification.request.topic
      value: platform.notifications.requested.v1
    - name: platform.notification.dlq.topic
      value: platform.notifications.requested.dlq.v1
    - name: platform.notification.consumer.group
      value: nifi-platform-notifications-requested-v1
    - name: platform.notification.service.url
      value: http://platform-notification-service.directus.svc.cluster.local:8080
    - name: platform.notification.executor.url
      value: http://platform-notification-executor.directus.svc.cluster.local:8080
    - name: platform.notification.execution.enabled
      value: "true"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-notification-nifi-registry-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-notification-nifi-registry-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-registry-flow
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_REGISTRY_API
              value: "http://nifi-registry.dataflow.svc.cluster.local:18080/nifi-registry-api"
            - name: NIFI_REGISTRY_BUCKET_ID
              value: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
            - name: NIFI_REGISTRY_FLOW_ID
              value: "9e6c0f08-967d-4f31-8355-6ec6e5fd8c7b"
            - name: NIFI_REGISTRY_FLOW_NAME
              value: "platform-notifications"
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail

              check_http() {
                local method="$1"
                local url="$2"
                local body_file="${3:-}"
                local status=""
                if [ -n "${body_file}" ]; then
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" \
                    -H "Content-Type: application/json" "${url}" --data @"${body_file}" || true)"
                else
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" "${url}" || true)"
                fi
                echo "${status}"
              }

              echo "Waiting for NiFi Registry API..."
              ready="false"
              for _ in $(seq 1 120); do
                code="$(check_http GET "${NIFI_REGISTRY_API}/buckets")"
                if [ "${code}" = "200" ]; then
                  ready="true"
                  break
                fi
                sleep 2
              done
              if [ "${ready}" != "true" ]; then
                echo "NiFi Registry API is not ready."
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}")"
              if [ "${code}" != "200" ]; then
                echo "Registry bucket id not found: ${NIFI_REGISTRY_BUCKET_ID}"
                cat /tmp/resp.json || true
                exit 1
              fi

              flow_url="${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}"
              code="$(check_http GET "${flow_url}")"
              if [ "${code}" = "404" ]; then
                cat > /tmp/flow.json <<EOF
              {
                "identifier": "${NIFI_REGISTRY_FLOW_ID}",
                "bucketIdentifier": "${NIFI_REGISTRY_BUCKET_ID}",
                "name": "${NIFI_REGISTRY_FLOW_NAME}",
                "description": "Platform notification orchestration flow"
              }
              EOF
                code="$(check_http POST "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows" /tmp/flow.json)"
                if [ "${code}" != "200" ] && [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
                  echo "Failed creating Registry flow: HTTP ${code}"
                  cat /tmp/resp.json || true
                  exit 1
                fi
              elif [ "${code}" != "200" ]; then
                echo "Unexpected response checking Registry flow: HTTP ${code}"
                cat /tmp/resp.json || true
                exit 1
              fi

              version_url="${flow_url}/versions/1"
              code="$(check_http GET "${version_url}")"
              if [ "${code}" = "404" ]; then
                code="$(check_http POST "${flow_url}/versions" /snapshot/flow-v1.json)"
                if [ "${code}" != "200" ] && [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
                  echo "Failed creating flow version 1: HTTP ${code}"
                  cat /tmp/resp.json || true
                  exit 1
                fi
              elif [ "${code}" != "200" ]; then
                echo "Unexpected response checking flow version 1: HTTP ${code}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${version_url}")"
              if [ "${code}" != "200" ]; then
                echo "Flow version 1 was not found after bootstrap."
                cat /tmp/resp.json || true
                exit 1
              fi

              echo "Git-managed notification flow version 1 is ready."
          volumeMounts:
            - name: flow-snapshot
              mountPath: /snapshot
              readOnly: true
      volumes:
        - name: flow-snapshot
          configMap:
            name: platform-notification-flow-snapshot
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiDataflow
metadata:
  name: platform-notifications
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "66"
spec:
  displayName: "platform-notifications"
  bucketId: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
  flowId: "9e6c0f08-967d-4f31-8355-6ec6e5fd8c7b"
  flowVersion: 1
  flowPosition:
    posX: 1200
    posY: 1
  syncMode: always
  updateStrategy: drain
  skipInvalidControllerService: true
  skipInvalidComponent: true
  clusterRef:
    name: nifi-external
    namespace: dataflow
  registryClientRef:
    name: platform-notification-flow-registry
    namespace: dataflow
  parameterContextRef:
    name: platform-notification-context
    namespace: dataflow
